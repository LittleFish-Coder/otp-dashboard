<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sora', sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .wrap { width: 100%; max-width: 600px; }
    .header { margin-bottom: 2.5rem; }
    .label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #666; margin-bottom: 8px; }
    .title { font-size: 28px; font-weight: 600; color: #f0f0f0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 1.5rem; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .card-surfshark::before { background: #1CBECA; }
    .card-netflix::before { background: #E50914; }
    .card-booking::before { background: #003580; }
    .service-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-surfshark { background: #1CBECA; }
    .dot-netflix { background: #E50914; }
    .dot-booking { background: #003580; }
    .service-name { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #888; }
    .badge { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 20px; }
    .badge-live { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-wait { background: #2a2a2a; color: #666; }
    .otp-code { font-family: 'Space Mono', monospace; font-size: 40px; font-weight: 700; letter-spacing: 0.15em; color: #f0f0f0; margin-bottom: 0.75rem; transition: all 0.3s ease; }
    .otp-code.waiting { color: #333; }
    .otp-code.flicker { animation: flicker 0.5s ease; }
    .time { font-size: 12px; color: #555; display: flex; align-items: center; gap: 6px; }
    .pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes flicker { 0%,100%{opacity:1} 20%{opacity:0.35} 40%{opacity:1} 60%{opacity:0.25} 80%{opacity:1} }
    .footer { margin-top: 2rem; font-size: 12px; color: #444; text-align: center; }
    .updated { color: #4ade80; font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <p class="label">live otp dashboard</p>
      <h1 class="title">Your codes, always fresh.</h1>
    </div>
    <div class="grid">
      <div class="card card-surfshark">
        <div class="service-row">
          <div class="dot dot-surfshark"></div>
          <span class="service-name">Surfshark</span>
          <span class="badge badge-live" id="badge-surfshark"><span class="pulse"></span> live</span>
        </div>
        <div class="otp-code" id="code-surfshark">——————</div>
        <div class="time" id="time-surfshark">loading...</div>
      </div>
      <div class="card card-netflix">
        <div class="service-row">
          <div class="dot dot-netflix"></div>
          <span class="service-name">Netflix</span>
          <span class="badge badge-wait" id="badge-netflix">waiting...</span>
        </div>
        <div class="otp-code waiting" id="code-netflix">——————</div>
        <div class="time" id="time-netflix">no code yet</div>
      </div>
      <div class="card card-booking">
        <div class="service-row">
          <div class="dot dot-booking"></div>
          <span class="service-name">Booking.com</span>
          <span class="badge badge-wait" id="badge-booking">waiting...</span>
        </div>
        <div class="otp-code waiting" id="code-booking">——————</div>
        <div class="time" id="time-booking">no code yet</div>
      </div>
    </div>
    <div class="footer">
      auto-refreshes every 5 seconds
      <div class="updated" id="last-updated"></div>
    </div>
  </div>

  <script>
    const GIST_ID = 'a96b8317f1a65a714bf1d43a170e0bd9';
    const GIST_URL = `https://gist.githubusercontent.com/LittleFish-Coder/${GIST_ID}/raw/otp.json`;

    function flickerCode(el) {
      el.classList.remove('flicker');
      void el.offsetWidth;
      el.classList.add('flicker');
    }

    async function fetchOTP() {
      try {
        const res = await fetch(GIST_URL + '?t=' + Date.now());
        const data = await res.json();

        if (data.surfshark) {
          document.getElementById('code-surfshark').textContent = data.surfshark.code || '——————';
          document.getElementById('time-surfshark').textContent = '🕐 ' + (data.surfshark.time || '—');
          document.getElementById('code-surfshark').classList.remove('waiting');
        }

        if (data.netflix) {
          const code = data.netflix.code;
          const el = document.getElementById('code-netflix');
          el.textContent = code || '——————';
          if (code && code !== '000000') {
            el.classList.remove('waiting');
            document.getElementById('badge-netflix').className = 'badge badge-live';
            document.getElementById('badge-netflix').innerHTML = '<span class="pulse"></span> live';
          }
          document.getElementById('time-netflix').textContent = '🕐 ' + (data.netflix.time || 'no code yet');
        }

        const booking = data.booking || data.booking_com || data['booking.com'];
        if (booking) {
          const code = booking.code;
          const el = document.getElementById('code-booking');
          el.textContent = code || '——————';
          flickerCode(el);
          if (code && code !== '000000') {
            el.classList.remove('waiting');
            document.getElementById('badge-booking').className = 'badge badge-live';
            document.getElementById('badge-booking').innerHTML = '<span class="pulse"></span> live';
          }
          document.getElementById('time-booking').textContent = '🕐 ' + (booking.time || 'no code yet');
        }

        document.getElementById('last-updated').textContent = 'last updated: ' + new Date().toLocaleTimeString('zh-TW');
      } catch (e) {
        console.error('fetch failed', e);
      }
    }

    fetchOTP();
    setInterval(fetchOTP, 5000);
  </script>
</body>
</html>
